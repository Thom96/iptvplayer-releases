# Bouwt de app en draait de unit tests bij elke pull request, zodat een kapotte build niet pas bij het
# publiceren opvalt. Ondertekent en publiceert niets.
name: Controleren

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controleren-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controleren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bouwen en testen
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Testresultaten bewaren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testresultaten
          path: /tmp/IPTVPlayer-build/app/reports/tests/
          if-no-files-found: ignore
