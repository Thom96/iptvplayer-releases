# Builds the app and runs the unit tests on every pull request, so a broken build is not first noticed when
# publishing. Signs and publishes nothing.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: /tmp/IPTVPlayer-build/app/reports/tests/
          if-no-files-found: ignore
