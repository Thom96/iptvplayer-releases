# Builds the app, signs it with our own key and puts it online as a GitHub release.
# The "check for updates" button in the app reads version.json from the latest release.
#
# Start (only from main, so an unmerged version never reaches the TV):
#  - Actions -> Publish -> Run workflow on main, with the "what's new" text, or
#  - push a commit to main whose message has a line starting with "[publiceren]"; the rest of that line
#    becomes the "what's new" text. (The marker stays Dutch: it is the owner's command word.)
#
# Required (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    release.jks as base64
#   KEYSTORE_PASSWORD  storePassword from keystore.properties
#   KEY_ALIAS          keyAlias from keystore.properties
#   KEY_PASSWORD       keyPassword from keystore.properties
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown in the app)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publiceren]'))
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Amsterdam # the version name contains date and time
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Without our own key the build falls back to a debug key; such an APK cannot be installed over the
      # existing app. Better to stop.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # The same tests as the pull request check (Check). The debug variant contains the test
          # activity the Compose tests need; unit tests don't use R8 anyway.
          bash ./gradlew --no-daemon assembleRelease testDebugUnitTest
          # build.gradle.kts puts the build output in java.io.tmpdir (/tmp).
          cp /tmp/IPTVPlayer-build/app/outputs/apk/release/app-release.apk IPTVPlayer.apk

      - name: Verify version and signature
        id: version
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs IPTVPlayer.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::APK is signed with the debug key"; exit 1; fi
          BADGING=$("$BT/aapt2" dump badging IPTVPlayer.apk | head -1)
          CODE=$(echo "$BADGING" | sed -E "s/.*versionCode='([0-9]+)'.*/\1/")
          NAME=$(echo "$BADGING" | sed -E "s/.*versionName='([^']*)'.*/\1/")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          NOTES="$INPUT_NOTES"
          # On a push: the rest of the "[publiceren] ..." line from the commit message.
          if [ -z "$NOTES" ]; then
            NOTES=$(printf '%s\n' "$COMMIT_MESSAGE" | grep -m1 '^\[publiceren\]' | sed 's/^\[publiceren\][[:space:]]*//')
          fi
          TAG="v$CODE"
          jq -n --argjson code "$CODE" --arg name "$NAME" --arg notes "$NOTES" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/IPTVPlayer.apk" \
            '{versionCode: $code, versionName: $name, apkUrl: $url, notes: $notes}' > version.json
          cat version.json
          gh release create "$TAG" IPTVPlayer.apk version.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Version $NAME" --notes "${NOTES:-Version $NAME}" --latest

      - name: Remove signing key
        if: always()
        run: rm -f release.jks keystore.properties
